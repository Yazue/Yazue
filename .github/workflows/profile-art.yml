name: Refresh profile animation

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out renderer
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out image branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: codex/profile-art
          path: profile-art

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Render from the public GitHub calendar
        run: |
          npm ci --ignore-scripts
          npm test
          npm run render

      - name: Publish changed images
        working-directory: profile-art
        run: |
          git add -- death-note-dark.gif death-note-dark-still.gif death-note-light.gif death-note-light-still.gif
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -m "Refresh profile animation"
          git push origin HEAD:refs/heads/codex/profile-art
